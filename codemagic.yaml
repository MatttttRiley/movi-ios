workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build unsigned IPA
        script: |
          set -e
          xcodebuild -project Movi.xcodeproj \
            -scheme Movi \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/Movi.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p $CM_BUILD_DIR/Payload
          cp -r $CM_BUILD_DIR/Movi.xcarchive/Products/Applications/Movi.app \
            $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR
          zip -r Movi-unsigned.ipa Payload
          echo "IPA built: $(du -h Movi-unsigned.ipa | cut -f1)"
    artifacts:
      - Movi-unsigned.ipa
