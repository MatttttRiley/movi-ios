name: Build unsigned IPA

# Builds the Movi iOS app with NO code signing and packages an unsigned .ipa.
# Sideloadly (or AltStore) re-signs it on your own computer with your Apple ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Icons are real PNGs tracked in the repo now; no base64 restore needed.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project Movi.xcodeproj \
            -scheme Movi \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Movi.app"
          test -d "$APP_PATH" || { echo "Movi.app not found"; exit 1; }
          rm -rf Payload Movi-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Movi-unsigned.ipa Payload
          unzip -l Movi-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movi-unsigned-ipa
          path: Movi-unsigned.ipa
          if-no-files-found: error
